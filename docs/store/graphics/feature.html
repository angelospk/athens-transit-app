<!doctype html><html lang="el"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@500;600;800&display=block" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1024px;height:500px;overflow:hidden;background:#0d1a3a;font-family:Commissioner,sans-serif;color:#fff}
.wrap{position:relative;width:1024px;height:500px;padding:0 0 0 64px;display:flex;flex-direction:column;justify-content:center}
.ic{width:104px;height:104px;border-radius:24px;margin-bottom:26px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
h1{font-weight:800;font-size:92px;line-height:1;letter-spacing:-.02em}
p{font-weight:500;font-size:34px;line-height:1.2;margin-top:14px;opacity:.85}
.phone{position:absolute;right:70px;top:56px;width:290px;height:520px;border-radius:38px 38px 0 0;background:#0a0a0a;padding:9px 9px 0;box-shadow:0 14px 40px rgba(0,0,0,.45)}
.phone div{width:100%;height:100%;border-radius:30px 30px 0 0;overflow:hidden;background:#fafafa}
.phone img{width:100%;display:block}
</style></head><body><div class="wrap">
<img class="ic" src="icon-src.png"><h1>Στάσεις</h1><p>Live συγκοινωνίες</p>
<div class="phone"><div><img src="home-src.png"></div></div></div></body></html>
