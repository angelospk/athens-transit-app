name: live_card
description: The bus's live card on Android, as a Live Update (Android 16) where the system allows it.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.5.0
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: dev.haroldpoi.live_card
        pluginClass: LiveCardPlugin
