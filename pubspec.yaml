name: athens_transit
description: "Στάσεις (staseis.gr): live buses, arrivals and alerts."
publish_to: 'none'
version: 0.3.0+9

environment:
  sdk: ^3.13.7

dependencies:
  flutter_localizations:
    sdk: flutter
  android_alarm_manager_plus: ^5.1.2
  flutter:
    sdk: flutter
  flutter_foreground_task: ^11.0.3
  flutter_local_notifications: ^22.3.3
  geolocator: ^14.1.2
  home_widget: ^0.10.0
  http: ^1.6.0
  live_card:
    path: packages/live_card
  maplibre_gl: ^0.27.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  timezone: ^0.11.2
  url_launcher: ^6.3.3
  flutter_animate: ^4.5.2
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/accents.json
    - assets/suburban.json
    - assets/welcome/
